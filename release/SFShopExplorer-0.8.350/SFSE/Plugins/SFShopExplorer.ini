; SF Shop Explorer 0.8.350 - release defaults.
; Everything here can be changed in-game or by editing this file; the shop
; writes back the settings you toggle. Delete a line to fall back to its default.

[overlay]
; Page Up opens and closes the shop.
toggleKey=33
uiScale=1.0
; 4 = native draw + input (required for the shop to be usable).
render=4
input=1

[itemcapture]
; Diagnostics only. 0 = off; leave it off for play.
mode=0

[shop]
fullscreen=0
theme=0
textSize=1
; 1 = apply selected OMODs and rarity through a world ref, so the modified
; instance reaches inventory. 0 = add a plain item instead.
attachMods=1
; Purchase probes. Leave 0; it writes eleven log lines per pick.
debugSpike=0

[preview]
; 1 = draw the plugin's own 3D preview. 0 = no plugin-side image.
legacyRenderer=1
; 1 = frame items with the engine's authored preview transform.
authoredOrientation=1

[offlinepreview]
enabled=1
; 0 = build from live game data instead of the shipped .sfmodel cache.
usecache=0
gpu=1
width=1024
height=768

[logging]
; 1 = include the per-item field-scan/node-walk probes. Diagnosis only.
verbose=0

[audio]
; 0-100. The Audio popup in the toolbar writes these on release.
musicVolume=45
sfxVolume=55
musicMuted=0
sfxMuted=0
; Optional: a file name from Audio\ (or Music\). Absent/empty follows the
; visual theme's own track.
; musicTrack=shop_music_dark.wav
; 1 = log the pause-state ring buffer every ~2s while the shop is open.
pauseDiag=0

[premium]
; Unlock progress, written by the plugin. 0 = nothing earned yet.
opens=0
spent=0
free=0
