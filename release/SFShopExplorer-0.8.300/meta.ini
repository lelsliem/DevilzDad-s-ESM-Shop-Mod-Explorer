nexusDescription="[center][b][color=#ff0000][size=6]DevilzDad's ESM Shop Mod Explorer[/size][/color]\n<br />\n<br />[color=#ffe599][size=5] Update ver: 0.8.123[/size][/color]\n<br />[/b]\n<br />\n<br />[b][color=#b6d7a8][size=4]Sorry for the delay; I’ve been dealing with a nightmare of self-inflicted bugs and a lot missing from Commonlibsf.[/size][/color]\n<br />[/b]\n<br />[list]\n<br />[*][b][size=4]Item rendering (unfinished, work in progress)[/size][/b][/*]\n<br />[*][b][size=4]Sound (music is awful but will improve later)[/size][/b][/*]\n<br />[*][b][size=4]relaxed filters[/size][/b][/*]\n<br />[*][b][size=4]improved options[/size][/b][/*]\n<br />[*][b][size=4]6 themes + 3 themes unlockable[/size][/b][/*]\n<br />[*][b][size=4]dropped all dependents except address library pgup to launch (cange change in ini)[/size][/b][/*]\n<br />[*][b][size=4]guns purchaced end up on the ground [/size][/b][/*]\n<br />[*][b][size=4]minor improvements and bugs fixed[/size][/b][/*]\n<br />[*][b][size=4]bug added a lag in rendering items (will be fixed at some point)[/size][/b][/*]\n<br />[/list][/center]\n<br />[center][b][size=4][color=#b6d7a8]To Change Lanch key:[/color] edit SFShopExplorer.ini in [overlay] change togglekey=33 to  togglekey=120 (this is F9) F1-F12 = 112-123, pg down = 34, home = 36, End = 35, Insert = 45 and 1-9 = 49-57[/size][/b][/center]\n<br />[center][/center]\n<br />[center][b][color=#fff2cc][size=5]Description:[/size][/color][/b][/center]\n<br />[center][color=#ffffff][size=4]An in-game shop and mod explorer. It reads every ESM, ESP and ESL in your load order and lets you browse, preview and buy anything that can actually go in a player's inventory, no console commands, no FormID hunting, no alt-tabbing to xEdit. Pick your plugin, pick a category, fill a basket, and it's in your pockets. For free, or for credits.\n<br />Inspired by perchik71's P71 In Game Shop Mod Explorer. Sadly, I'm nowhere near as talented.[/size][/color][/center]\n<br />[center]\n<br />[b][color=#fff2cc][size=5]Features:[/size][/color][/b]\n<br />[color=#ffffff][size=4]Everything, everywhere, browses all loaded ESM/ESP/ESL plugins and only shows ones that actually contain stock, with ESM/ESP/ESL badges so you know what you're looking at. []Seven real categories - Armor, Weapons, Ammo, Consumables, Books, Keys and Misc. Only inventory-safe types are listed. Junk auto-filtered - test/debug creation-kit rounds, creature and corpse skins, unarmed creature \"attacks\", ship weapons and non-playable ammo are kept out of the shop. Advanced users can add their own patterns in the INI. Search that actually works - one box searches item names and editor IDs across the entire list, not just the current page. Long lists are cleanly Organized . Item previews - name, FormID, value, weight, source plugin, and the item's description text where the game has one. A proper basket - queue up to 25 items (any quantity of each), then transfer everything in one go. Free mode or credits - flip the Free toggle for a cheat shop, or leave it off and purchases are paid for out of your real credit balance, shown live at the top right. Controller support - left stick moves a cursor, A clicks, X drops an item straight in the basket, B closes, LB/RB flip pages, right stick scrolls, Start accepts.[/size][/color]\n<br />[color=#ffffff][size=4]No console, ever - open with F10, close with B or F10, everything refreshes itself.[/size][/color]\n<br />\n<br />[b][color=#fff2cc][size=5]Getting started:[/size][/color]\n<br />[/b]\n<br />[list=1]\n<br />[*][color=#ffffff][size=4]Install the requirements[/size][/color][/*]\n<br />[*][color=#ffffff][size=4]Install this mod with a mod manager (or manually — see below)[/size][/color][/*]\n<br />[*][color=#ffffff][size=4]Launch the game through SFSE[/size][/color][/*]\n<br />[*][color=#ffffff][size=4]In game, press F10 and click DevilzDad's Shop + Explorer. If the plugin list looks stale, hit Refresh at the top right[/size][/color][/*]\n<br />[*][color=#ffffff][size=4]Pick a plugin, pick a category, double-click items to basket them, then hit Accept[/size][/color][/*]\n<br />[/list][/center]\n<br />[center][b][color=#fff2cc][size=5]Requirements:[/size][/color][/b][/center]\n<br />[center][b][color=#fff2cc][size=5]Update ver: 0.8.123[/size][/color]\n<br />[/b][color=#ffffff][size=4][url=https://store.steampowered.com/agecheck/app/1716740/][b]Starfield version 1.16.244[/b][/url][/size][/color][/center]\n<br />[center][b][url=https://www.nexusmods.com/starfield/mods/106][size=4]SFSE[/size][/url][/b][/center]\n<br />[center][b][size=4][url=https://www.nexusmods.com/starfield/mods/3256]Address Library[/url][/size][/b][/center]\n<br />[center][b][color=#fff2cc][size=4]no longer needed only for versiob 0.5.0[/size][/color][/b][/center]\n<br />[center][b][size=4][url=https://www.nexusmods.com/starfield/mods/17711]OSF UI[/url][/size][/b][/center]\n<br />[center][b][size=4][url=https://developer.microsoft.com/en-us/microsoft-edge/webview2?form=MA13LH&amp;cs=2066983347][color=#e69138]Microsoft WebView2 Runtime[/color][/url][color=#fff2cc] [/color][color=#ffffff](already on most Windows 10/11 systems)[/color][/size]\n<br />\n<br />[size=5][color=#fff2cc]Installation:[/color][/size]\n<br />[/b][size=4]Install Requirements above[/size][/center]\n<br />[center][color=#ffffff][size=4]Install this mod on your mod manager just like you would any other mod. [/size][/color][/center]\n<br />[center][color=#ffffff][size=4]To manually install, place the .ini and .dll files into your Starfield game’s Root&#92;Data&#92;SFSE&#92;Plugins&#92;DevilzESMShop.dll Data&#92;SFSE&#92;Plugins&#92;DevilzESMShop.ini\n<br />Data&#92;SFSE&#92;Plugins&#92;OSFUI&#92;views&#92;devilzdad.devilzshop&#92; ← the shop's UI — required, don't skip this one[/size][/color][/center]\n<br />[center][/center]\n<br />[center][b][color=#fff2cc][size=5]Main features:[/size][/color][/b][/center]\n<br />[center][size=4][color=#ffffff]It a shop that loads all your esm esl esp files Filters out anything not inventory-safe and displays only mods containing items from the player’s inventory, weapons, armour, ammo, consumables, books, keys and misc. To load launch[/color][/size][color=#ffffff]  [/color][url=https://www.nexusmods.com/starfield/mods/17711][color=#ffffff][b][size=4]OSF UI[/size][/b][/color][/url][b][color=#ffffff] [/color][/b][size=4][color=#ffffff]with f10 and open DevilzDad's ESM Shop + Explorer and press refresh top right if mods dont load. theres an option to get everything for free or you can pay with with your in game credits. [/color][/size]\n<br />\n<br />[color=#fff2cc][size=5]Configuration:[/size][/color]\n<br />[color=#ffffff][size=4]DevilzESMShop.ini (next to the DLL) controls the junk filter:\n<br />skipPatterns=TEST,DEBUG,DUMMY,Creature,Rakghoul,Corpse,NOTPLAYABLE\n<br />Comma-separated. Editor IDs match anywhere in the ID; display names match whole words only, so \"Test\" will never hide \"Latest\"[/size][/color].\n<br />\n<br />[size=5][color=#ffd966]⚠[/color][color=#ff0000]warning[/color][color=#ffd966]⚠[/color][/size][size=4][color=#ffd966] \n<br />It’s still in development and may have some bugs, so make a new save before adding items to your inventory and double-check they’re there. The limit is 25 items, but you can have as many of each as you like. If you don’t recognize an item, you probably don’t need it. Always test on a new save first, as adding certain things could break your game if you’re not careful. I take no responsibility for any issues caused by carelessness. I’ve tried to filter as many tags as possible to keep this safe, but a few might have slipped through.[/color][/size][/center]\n<br />[center][/center]\n<br />[center][b][color=#fff2cc][size=5]Shout outs:[/size][/color][/b][/center]\n<br />[center][color=#ffffff][size=4]Inspired by [url=https://www.nexusmods.com/fallout4/mods/56922]P71 In Game Shop Mod Explorer[/url] massive thank you to [url=https://www.nexusmods.com/profile/perchik71]perchik71[/url] mod would exsist otherwise[/size][/color][/center]\n<br />[center][color=#ffffff][size=4]Thank you to [url=https://www.nexusmods.com/profile/ozooma10]ozooma10[/url] for [url=https://www.nexusmods.com/starfield/mods/17711]OSF UI[/url]  this is what holds it all together [/size][/color][/center]\n<br />[center][color=#ffffff][size=4]Thank you to [url=https://www.nexusmods.com/profile/meh321]meh321[/url] for [url=https://www.nexusmods.com/starfield/mods/3256]Address Library\n<br />\n<br />[/url][/size][/color]\n<br />[color=#ffffff][size=4][url=https://www.nexusmods.com/starfield/mods/3256][b][color=#ff4d5e]DevilzDad's Shop + Explorer[/color][/b] [size=2][i]Loaded worlds • forbidden wares • one inventory[/i][/size][/url][/size][/color][/center]\n<br />"
