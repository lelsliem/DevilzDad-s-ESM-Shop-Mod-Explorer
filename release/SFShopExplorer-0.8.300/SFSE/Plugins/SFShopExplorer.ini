; DevilzDad's ESM Shop + Explorer 0.8.300 - default settings
;
; This file sits next to SFShopExplorer.dll. The plugin rewrites the values it
; owns (theme, progress, overlay scale) as you use it, so what is here is a
; starting point, not a lock-in.

[overlay]
; Virtual-key code for open/close. 33 = Page Up (default), 120 = F9.
; F1-F12 = 112-123, Page Down = 34, Home = 36, End = 35, Insert = 45, 1-9 = 49-57.
toggleKey=33
uiScale=1.0
; 4 = the normal overlay renderer. Lower values are diagnostics.
render=4
; 1 = the open shop takes mouse and keyboard input.
input=1
; Backdrop dim behind the shop, 0-255.
backdropAlpha=150

[shop]
; Alpha of the shop panel, percent (0-100).
alpha=60
; 0 = smallest text, 3 = largest.
textSize=1
; Editor IDs / names to keep out of the list. Editor IDs match anywhere in the
; ID; display names match whole words only, so "Test" never hides "Latest".
skipmodels=TEST,DEBUG,DUMMY,Creature,Rakghoul,Corpse,NOTPLAYABLE

[preview]
; 1 = the PREVIEW viewport draws the plugin's own 3D render (default).
; 0 = draw no plugin-side image at all; diagnostics only.
legacyRenderer=1
; 1 = frame items with the engine's authored preview transform, which is what
; the inventory screen uses. 0 = frame from model bounds only.
authoredOrientation=1

[offlinepreview]
; The plugin's own 3D previewer. Disabling it leaves only the native dispatch.
enabled=1
gpu=1
; Backing resolution of the detached preview; sharper and slower when raised.
width=1024
height=768
; 1 (default) = reuse the on-disk model cache (.sfmodel files). 0 = rebuild from
; the live game data every time; only useful when verifying a rendering change.
usecache=1

[audio]
enabled=1
; Percentages.
musicVolume=55
sfxVolume=75
; Optional music file, absolute path or relative to the plugin folder.
; musicFile=

[livemodel]
enabled=1

[itemcapture]
; 0 = disabled (default, inert). 1 and 2 are diagnostics for the engine's own
; item viewport and are not needed for normal use.
mode=0
