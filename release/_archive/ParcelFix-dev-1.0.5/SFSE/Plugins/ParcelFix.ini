[ParcelFix]
; 0 stops the plugin doing anything without removing it.
bEnabled=1

; 1 hides the leftovers it finds.
; 0 is a dry run: the same scan and the same log lines, but nothing is changed.
; Use 0 first if you want to read the candidate list before it acts.
bAct=1

; 1 lists every runtime-created reference the sweep saw - ids, base forms,
; flags, distance, name - and 200 of the references nearest the player, whether
; they were created or not. The created list is written first, so a page of
; planted scenery can no longer push it off the end of the log. Nothing is
; changed by the listing itself; bAct still decides what gets hidden.
bDiagnose=1

; 0 (default): hide every runtime-created reference whose base object is a type
; the shop sells, within iRadius. This is the rule that finds the old parcels.
; 1: also require persistent, deleted or disabled, as 1.0.2 to 1.0.4 did. Use
; it if the broad rule ever hides something in a cell that matters to you.
bFlagsOnly=0

; How far from the player to look, in engine units (about 70 per metre).
; The parcels were dropped at the player's feet, so 1500 reaches the whole pad.
iRadius=1500
