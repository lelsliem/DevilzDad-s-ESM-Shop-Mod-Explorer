; ============================================================================
; SF Shop Explorer 0.9.1 - settings
; ============================================================================
; The shop runs on a hotkey and owns no game menu. Page Up toggles it; close it
; with Escape, the X in its title bar, or Page Up again.
;
; Every line here can be edited by hand or changed in game, and the shop writes
; back the settings you toggle (volume, theme, text size, sort column, favourites
; and premium progress), so a restart keeps them. Deleting a line falls back to
; the default shown beside it - the defaults below are the release defaults.
;
; Keys are case-insensitive. Numbers are plain integers unless the comment says
; otherwise. A leading ";" comments out the line.
;
; Where a setting is read matters for support: this file is read from the folder
; the DLL sits in, i.e. Data\SFSE\Plugins\SFShopExplorer.ini, not from
; Documents\My Games\Starfield.
; ============================================================================

[overlay]
; The shop itself: the hotkey, the draw mode and the UI scale. Everything in
; this section is read once at startup and again on every open.
;
; Virtual-key code of the open/close key. 33 = Page Up (default).
;   33 Page Up      34 Page Down     35 End          36 Home
;   45 Insert       112-123 F1-F12    49-57 1-9
; A key that the game also binds still toggles the shop; the shop swallows its
; own toggle press while open, so one press is one toggle. 0 disables the
; hotkey (close with Escape only).
toggleKey=33
;
; Scale for everything the shop draws - fonts, padding, row heights and the
; header - as one number. 1.0 is 100%; 1.25 is comfortable on a 1440p screen;
; 0.85 fits more rows on 1080p. Range 0.5-2.0, clamped.
uiScale=1.0
;
; How the shop is presented. 4 = draw the interface and take input (the only
; setting that gives a usable shop).
;   0 = off, 1 = hook DXGI only, 2 = hook and find the device,
;   3 = initialize ImGui but draw nothing (diagnostic), 4 = full draw + input.
; Below 4 the shop refuses to open rather than freezing the world with no
; interface, and writes the reason to SFShopExplorer.log.
render=4
;
; 1 = the shop takes the keyboard and mouse while it is open (normal),
; 0 = it draws but leaves input to the game (diagnostic; the virtual cursor is
; not driven, so nothing in the shop can be clicked).
input=1

[itemcapture]
; Engine-frame capture used by the preview pipeline: the shop watches the
; render target the inventory menu renders the item into, and reuses those
; pixels instead of re-rendering the model. Off for play.
;
;   0 = off (default). No hook, no captures, no log noise.
;   1 = verify. Install the hook and log each candidate it sees - resolution,
;       format, aspect - without displaying anything. This is the setting to
;       use when a preview is blank and you want to know why.
;   2 = display. Feed the captured frame into the preview panel.
; The remaining keys in this section (formatFilter, maxDimension, menuName,
; minAspect, maxAspect, slot, fullTexture) are diagnostics with defaults that
; are correct for the shipping game; they are not listed here because changing
; them produces a blank preview, not a different look. See ItemCapture.cpp.
mode=0

[shop]
; Shopping behaviour and the look of the catalog. fullscreen and theme are read
; at startup; textSize and the sort keys are written as you change them.
;
; 1 = the shop's window may cover the whole screen (default), 0 = it opens at
; about 90% of the screen size, centred. Toggled by the maximise glyph.
fullscreen=0
;
; Colour theme, 0-8:
;   0 Devilz Red      1 Void Blue       2 Star Gold      3 Terminal Green
;   4 Paper Ledger    5 Hazard          6 Starfield      7 Hell
;   8 Heaven
; 7 and 8 are the unlockable pair (see [premium]). Out-of-range values clamp.
theme=0
;
; Body text size, 0-3: 0 Small, 1 Medium (default), 2 Large, 3 Extra Large.
; The header and captions scale with it. Also in the toolbar's Aa popup.
textSize=1
;
; Item-list sort. Written automatically when you click a column header, which
; is why the two keys are commented out here. sortColumn is 1-based:
;   1 NAME   2 TYPE   3 VALUE   4 WT   5 FORMID
; Absent or 0 keeps catalog order. sortAscending is 1 for A-Z / 0-9 and
; 0 for descending. The shop remembers the last click across restarts.
; sortColumn=1
; sortAscending=1
;
; How a purchase is delivered.
;   1 = spawn a world reference, attach the selected OMODs and the rolled
;       rarity to it, then move that instance into the player's inventory. This
;       is what makes a modded gun arrive with its parts and its legendary
;       effect instead of as a plain copy.
;   0 = add a plain base item; OMODs and rarity are not applied.
; Slower on the engine side (one reference per purchase); leave it at 1.
attachMods=1
;
; Purchase-spike diagnostics: logs the eleven engine calls a purchase makes
; (activation code, transfer result, inventory confirmation) once per pick.
; Leave 0 for play; 1 when a purchase is not landing.
debugSpike=0

[preview]
; The item preview panel in the catalog. Both keys are read at startup.
;
; 1 = draw the plugin's own 3D preview of the selected record (default).
; 0 = no plugin-side image: the panel keeps its frame and text, but the model
; is not rendered. Useful to tell a slow preview from a broken model path.
legacyRenderer=1
;
; 1 = frame items with the transform the artist authored for the inventory
; menu (default): the same camera angle and distance the game uses, so a
; weapon shows its sights rather than its stock end.
; 0 = fit the whole model into the frame regardless of the authored transform,
; which is what makes large or oddly pivoted meshes visible at all.
authoredOrientation=1

[offlinepreview]
; The standalone 3D previewer: it reads the item's NIF out of the BA2s and
; draws it with its own pipeline, so a preview does not depend on the game
; having ever rendered that item on screen.
;
; 1 = preview is available (default), 0 = the panel falls back to the captured
; engine frame or to text only.
enabled=1
;
; Where the geometry comes from.
;   1 = the shipped .sfmodel cache in SFShopExplorerAssets\models - instant,
;       and the reason a first preview is fast on a fresh save.
;   0 = build from live game data on demand (default here): always current,
;       costs a second or two on the first look at a large mesh.
; The cache is rebuilt from live data whenever its archive fingerprint does not
; match, so a stale cache cannot shadow a modded mesh.
usecache=0
;
; 1 = assemble and draw the model on the GPU (default), 0 = CPU rasterizer.
; The CPU path exists for machines where the compute pipeline misbehaves; it is
; much slower and only meant for diagnosis.
gpu=1
;
; Preview frame size in pixels. Larger is sharper and costs more per redraw.
; The panel scales the result, so 1024x768 is already generous.
width=1024
height=768

[logging]
; 0 = normal (default): startup, the archive/index summaries, settings, one
; line per open/close, purchases, warnings and errors - a few dozen lines for a
; session. This is what a player sees, so nothing routine is written here.
; 1 = add the diagnostic streams, all of which are off by default: the per-item
; RTTI field scan and render-target node walk (one item can write hundreds of
; lines, and a session over a large catalog has produced 35,000), the per-archive
; open list (one line per BA2 - around 900 with a large mod list), the per-type
; form-array offsets, the preview framing lines, the audio streaming heartbeat
; and the direct-preview rebuild counts.
; It also arms the two probes that write outside the log: the DRED
; breadcrumb block at plugin load and the %TEMP%\SFShopExplorer-prefetch.txt
; trace. Both are off in a normal session.
; Set it to 1 when reporting a problem, send the log, then set it back to 0:
; this file is also the support log.
verbose=0

[audio]
; The shop mixes its own music and effects through WASAPI and ducks the game's
; session while it is open. All six keys are written by the Audio popup in the
; toolbar when you release the slider or click a checkbox.
;
; Music volume, 0-100 (default 45). Applies to the shop's music only; the
; game's own volume is untouched.
musicVolume=45
;
; Sound-effect volume, 0-100 (default 55): the open sting, the close sting,
; page turns and the confirm/deny clicks.
sfxVolume=55
;
; 1 = music muted, 0 = audible (default). Same switch as the checkbox.
musicMuted=0
;
; 1 = effects muted, 0 = audible (default).
sfxMuted=0
;
; Which track plays. A bare file name from Audio\ (or Music\) beside the DLL.
; Absent or empty follows the visual theme's own track, so changing theme
; changes the music. A name that does not exist falls back to the theme track
; rather than to silence.
;
; WAV, MP3, FLAC, M4A/AAC and WMA all play: anything that is not a .wav is
; decoded by the Media Foundation decoder Windows already ships, so no
; codec is downloaded. OGG needs a Vorbis codec installed (Windows has none by
; default): it still lists, and picking it keeps the current track playing
; instead of going silent. Only the first 6 minutes of a track loop.
; musicTrack=shop_music_dark.wav      e.g. musicTrack=my_theme.mp3
;
; 1 = log the pause-state ring buffer every ~2 seconds while the shop is open:
; the requested floor, the counter the game actually reports, and whether the
; world is still. Only useful when a menu or a mod fights the freeze.
pauseDiag=0

[premium]
; Unlock progress, maintained by the plugin. Do not hand-edit these three:
; they are the record of what the player has earned, and the two themes that are
; unlocked by using the shop key off them.
;
; Shop visits counted (each open counts once). Default 0.
opens=0
;
; Credits spent through the shop, lifetime. Default 0.
spent=0
;
; Free deliveries used (a purchase that was granted rather than paid for).
; Default 0.
free=0
