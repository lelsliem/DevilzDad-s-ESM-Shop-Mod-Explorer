; This build reads no key from this file, and has dropped the section that used
; to hold one.
;
; The shop is an OSF UI view: OSF opens it (its interface list in Mod Settings,
; or the open key it binds) and OSF closes it (Escape / pad B / the page's close
; button). The plugin declares the open key to OSF UI as a key setting
; ("openKey", Page Up by default) when it attaches, so rebinding it is OSF's
; job, not a hex key code here. A leftover toggleKey from 0.8.349 is ignored,
; not honoured.

[logging]
; 0 = info only (default). 1 = the renderer DEBUG probes at startup.
verbose=0

[offlinepreview]
; 3D preview frame size for the page. Square keeps the model centred in the
; preview panel; 640 is a good balance of sharpness and frame time. The page
; scales whatever comes back, so this only trades quality for render cost.
width=640
height=640

; The remaining preview keys are the standalone build's, and are honoured here
; too if you want to tune framing:
;   zoom=2.05        model magnification inside the frame
;   pitch=-22        camera pitch in degrees
;   bg / bgg / bgb   backdrop RGB, 0-255 (default is the dark slate)
