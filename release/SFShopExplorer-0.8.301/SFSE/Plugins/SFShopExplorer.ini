[overlay]
toggleKey=33
uiScale=1.0
render=4
input=1

[itemcapture]
; Diagnostics disabled by default; change to 1 or 2 only when testing.
mode=0
[premium]
opens=230
spent=0
free=45
[shop]
fullscreen=0
theme=6
textSize=1
music=1

[offlinepreview]
; Higher backing resolution reduces upscaling in the detached item preview.
; Force this test to build from the live model data, not disk .sfmodel caches.
enabled=1
usecache=0
gpu=1
width=1024
height=768

[preview]
; 0 = the shop PREVIEW viewport draws no plugin-side image at all: no
;     direct GPU render and no captured game frame, only an on-screen
;     notice plus the native dispatch result. Set this before judging a
;     native-render test, so a plugin-drawn picture cannot be mistaken
;     for a native result. 1 (default) restores the previous preview.
legacyRenderer=1
; 1 = frame items with the engine's authored preview transform
; (PTT2 slot 4, then 0, else bounds). 0 = the old bounds-only framing.
authoredOrientation=1
